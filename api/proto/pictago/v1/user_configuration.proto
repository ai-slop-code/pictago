syntax = "proto3";

package pictago.v1;

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/ai-slop-code/pictago/api/proto/pictago/v1";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  security_definitions: {
    security: {
      key: "BearerAuth"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "JWT Bearer token. Format: 'Bearer <token>'"
      }
    }
  }
};

service UserConfiguration {
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse) {
    option (google.api.http) = {
      get: "/v1/config/upload_limit"
    };
  }
  rpc UpdateConfig(UpdateConfigRequest) returns (UpdateConfigResponse) {
    option (google.api.http) = {
      put: "/v1/config/upload_limit"
      body: "*"
    };
  }

  rpc GetApiKeys(GetApiKeysRequest) returns (GetApiKeysResponse) {
    option (google.api.http) = {
      get: "/v1/config/api_keys"
    };
  }
  rpc CreateApiKey(CreateApiKeyRequest) returns (CreateApiKeyResponse) {
    option (google.api.http) = {
      post: "/v1/config/api_keys"
      body: "*"
    };
  }

  rpc DeleteApiKey(DeleteApiKeyRequest) returns (DeleteApiKeyResponse) {
    option (google.api.http) = {
      delete: "/v1/config/api_keys/{key_id}"
    };
  }

  rpc CreateFileCollection(CreateFileCollectionRequest) returns (CreateFileCollectionResponse) {
    option (google.api.http) = {
      post: "/v1/config/file_collections"
      body: "*"
    };
  }

  rpc GetFileCollections(GetFileCollectionsRequest) returns (GetFileCollectionsResponse) {
    option (google.api.http) = {
      get: "/v1/config/file_collections"
    };
  }

  rpc DeleteFileCollection(DeleteFileCollectionRequest) returns (DeleteFileCollectionResponse) {
    option (google.api.http) = {
      delete: "/v1/config/file_collections/{collection_id}"
    };
  }

  rpc UpdateFileCollection(UpdateFileCollectionRequest) returns (UpdateFileCollectionResponse) {
    option (google.api.http) = {
      put: "/v1/config/file_collections/{collection_id}"
      body: "*"
    };
  }

  rpc GetFileCollection(GetFileCollectionRequest) returns (GetFileCollectionResponse) {
    option (google.api.http) = {
      get: "/v1/config/file_collections/{collection_id}"
    };
  }
}

message GetConfigRequest {}

message GetConfigResponse {
  string max_upload_bytes = 1;
}

message UpdateConfigRequest {
  string max_upload_bytes = 1;
}

message UpdateConfigResponse {
  bool success = 1;
}

message GetApiKeysRequest {}

message ApiKey {
  string key_id = 1;
  string api_key = 2;
}

message GetApiKeysResponse {
  repeated ApiKey api_keys = 1;
}

message CreateApiKeyRequest {}

message CreateApiKeyResponse {
  ApiKey api_key = 1;
}

message DeleteApiKeyRequest {
  string key_id = 1;
}

message DeleteApiKeyResponse {
  bool success = 1;
}

message CreateFileCollectionRequest {
  string name = 1;
}

message CreateFileCollectionResponse {
  string collection_id = 1;
}

message GetFileCollectionsRequest {}

message FileCollection {
  string collection_id = 1;
  string name = 2;
}

message GetFileCollectionsResponse {
  repeated FileCollection collections = 1;
}

message DeleteFileCollectionRequest {
  string collection_id = 1;
}

message DeleteFileCollectionResponse {
  bool success = 1;
}

message UpdateFileCollectionRequest {
  string collection_id = 1;
  string name = 2;
}

message UpdateFileCollectionResponse {
  bool success = 1;
}

message GetFileCollectionRequest {
  string collection_id = 1;
}

message GetFileCollectionResponse {
  FileCollection collection = 1;
}
