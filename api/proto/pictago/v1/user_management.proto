syntax = "proto3";

package pictago.v1;

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "api/proto/pictago/v1/user_info.proto";

option go_package = "github.com/ai-slop-code/pictago/api/proto/pictago/v1";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  security_definitions: {
    security: {
      key: "BearerAuth"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "JWT Bearer token. Format: 'Bearer <token>'"
      }
    }
  }
};

service Management {
  rpc GetSystemStatus(GetUsersRequest) returns (GetUsersResponse) {
    option (google.api.http) = {
      get: "/v1/management/users"
    };
  }

  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {
    option (google.api.http) = {
      post: "/v1/management/users"
      body: "*"
    };
  }

  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse) {
    option (google.api.http) = {
      delete: "/v1/management/users/{user_id}"
    };
  }
}

message GetUsersRequest {}

message GetUsersResponse {
  repeated GetUserInfoResponse users = 1;
}

message CreateUserRequest {
  string username = 1;
  string password = 2;
}

message CreateUserResponse {
  string id = 1;
  string username = 2;
}

message DeleteUserRequest {
  string user_id = 1;
}

message DeleteUserResponse {
  string user_id = 1;
}
