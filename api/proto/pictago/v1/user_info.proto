syntax = "proto3";

package pictago.v1;

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/ai-slop-code/pictago/api/proto/pictago/v1";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  security_definitions: {
    security: {
      key: "BearerAuth"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "JWT Bearer token. Format: 'Bearer <token>'"
      }
    }
  }
};

service UserInfo {
  rpc GetUserInfo(GetUserInfoRequest) returns (GetUserInfoResponse) {
    option (google.api.http) = {
      get: "/v1/user/me"
    };
  }
  rpc GetUserStatistics(GetUserStatisticsRequest) returns (GetUserStatisticsResponse) {
    option (google.api.http) = {
      get: "/v1/user/statistics"
    };
  }
}

message GetUserInfoRequest {}

message GetUserInfoResponse {
  string username = 1;
  string id = 2;
}

message GetUserStatisticsRequest {}

message GetUserStatisticsResponse {
  int32 total_files_uploaded = 1;
  int32 total_storage_used_bytes = 2;
  int32 total_collections_created = 3;
  int32 total_api_keys = 4;
}
