# golangci-lint config — run with: golangci-lint run
run:
  timeout: 2m
  modules-download-mode: readonly
  go: '1.21'

linters:
  enable:
    - errcheck
    - gofmt
    - govet
    - ineffassign
    - staticcheck
    - unused
  disable:
    - deadcode
    - varcheck

linters-settings:
  govet:
    enable-all: true
    disable:
      - fieldalignment
  errcheck:
    check-type-assertions: true
    check-blank: true

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - ineffassign
