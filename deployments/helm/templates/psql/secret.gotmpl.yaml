{{- if and (.Values.postgres.enabled | default false) (not .Values.postgres.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pictago.fullname" . }}-postgres-credentials
  labels:
    {{- include "pictago.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ required "postgres.auth.username is required when existingSecret is not set" .Values.postgres.auth.username | quote }}
  password: {{ required "postgres.auth.password is required when existingSecret is not set" .Values.postgres.auth.password | quote }}
{{- end }}
