{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "pictago.fullname" . }}-public-route
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{ include "pictago.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- range .Values.httpRoute.parentRefs }}
    - group: {{ .group | default "gateway.networking.k8s.io" }}
      kind: {{ .kind | default "Gateway" }}
      name: {{ .name }}
      namespace: {{ .namespace }}
    {{- end }}
  hostnames:
    {{- range .Values.httpRoute.hostnames }}
    - {{ . }}
    {{- end }}
  rules:
    # Application routes
    {{- range .Values.httpRoute.rules }}
    - matches:
        {{- range .matches }}
        - path:
            type: {{ .path.type | default "PathPrefix" }}
            value: {{ .path.value }}
        {{- with .headers }}
          headers:
            {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- with .queryParams }}
          queryParams:
            {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- end }}
      backendRefs:
        # Direct routing to backend service(s)
        {{- range .backendRefs }}
        - group: {{ .group | default "" }}
          kind: {{ .kind | default "Service" }}
          name: {{ .name }}
          port: {{ .port }}
          weight: {{ .weight | default 1 }}
        {{- end }}
    {{- end }}
{{- end }}
