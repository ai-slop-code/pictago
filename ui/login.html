<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login — Pictago</title>
  <style>
*{box-sizing:border-box}
body{font-family:system-ui,sans-serif;margin:0;min-height:100vh;background:#0f0f12;color:#e4e4e7;display:flex;align-items:center;justify-content:center;padding:1rem}
.card{background:#18181c;border:1px solid #2a2a32;border-radius:10px;padding:2rem;width:100%;max-width:320px}
h1{font-size:1.25rem;margin:0 0 1rem 0}
.form-group{margin-bottom:1rem}
.form-group label{display:block;font-size:0.875rem;color:#71717a;margin-bottom:0.25rem}
.form-group input{width:100%;padding:0.5rem 0.75rem;border:1px solid #2a2a32;border-radius:6px;background:#0f0f12;color:#e4e4e7;font-size:1rem}
.form-group input:focus{outline:none;border-color:#a78bfa}
button{width:100%;padding:0.6rem;background:#a78bfa;color:#0f0f12;border:none;border-radius:6px;font-size:1rem;font-weight:500;cursor:pointer}
button:hover{background:#c4b5fd}
.error{color:#f87171;font-size:0.875rem;margin-top:0.5rem}
  </style>
</head>
<body>
  <div class="card">
    <h1>Pictago</h1>
    <form id="f" method="post" action="/api/login">
      <div class="form-group">
        <label for="u">Username</label>
        <input type="text" id="u" name="username" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="p">Password</label>
        <input type="password" id="p" name="password" required autocomplete="current-password">
      </div>
      <div id="err" class="error"></div>
      <button type="submit">Sign in</button>
    </form>
  </div>
  <script>
document.getElementById("f").onsubmit=async function(e){
  e.preventDefault();
  var err=document.getElementById("err");
  err.textContent="";
  var r=await fetch("/api/login",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({username:document.getElementById("u").value,password:document.getElementById("p").value})
  });
  if(r.ok){window.location.href="/admin/";return}
  var j=await r.json();
  err.textContent=j.error||"Login failed";
};
  </script>
</body>
</html>
